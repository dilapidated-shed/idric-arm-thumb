name: verify

on:
  push:
    branches: [native-arm]
  pull_request:

concurrency:
  group: arm-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm-thumb:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Check out pinned Idriç compiler
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/Idric
          ref: ad674be3e2f0eade5cd007c419a0f0c048548d6a
          path: Idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl ca-certificates clang lld file libgmp-dev qemu-user

      - name: Bootstrap pinned Idriç
        run: |
          ./Idric/edric bootstrap
          printf '%s\n' "$GITHUB_WORKSPACE/Idric/.tools/bin" >> "$GITHUB_PATH"

      - name: Install pinned Idriç support, libraries and compiler API
        run: |
          make -C Idric install-support PREFIX="$HOME/.idris2"
          make -C Idric install-bootstrap-libs IDRIS2="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-api IDRIS2_BOOT="$GITHUB_WORKSPACE/Idric/build/exec/idris2"
          make -C Idric install-support

      - name: Verify native ARM/Thumb numerical, PrintASCII, and branching paths
        run: make verify IDRIC="$GITHUB_WORKSPACE/Idric/build/exec/idris2"

      - name: Build screen-red references and execute RGB565 oracle
        run: sh tests/framebuffer/check.sh
