name: Temporary Idriç terminology repair

on:
  push:
    branches:
      - docs/idric-terminology-audit

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/idric-terminology-audit
          fetch-depth: 0

      - name: Normalize DEX design prose and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/Backend/DEX/PSEUDO_REGISTER_IR.md'),
              Path('src/Backend/DEX/OPCODES.md'),
          ]
          total = 0
          for path in paths:
              text = path.read_text()
              count = text.count('Edriç')
              if count == 0:
                  raise SystemExit(f'expected Edriç prose in {path}')
              path.write_text(text.replace('Edriç', 'Idriç'))
              total += count
          if total < 2:
              raise SystemExit(f'unexpected replacement count: {total}')
          PY

          rm .github/workflows/idric-terminology-fix-temp.yml
          git config user.name 'isomorphisms terminology audit'
          git config user.email 'isomorphisms@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Normalize Idriç terminology in DEX notes'
          git push origin HEAD:docs/idric-terminology-audit
